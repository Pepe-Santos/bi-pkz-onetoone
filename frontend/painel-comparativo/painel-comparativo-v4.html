<style>
  .campo{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .campo input{min-height:48px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:400}
  .campo input:focus-visible{outline:2px solid #c2f24a;outline-offset:1px;border-color:var(--accent)}
  .botao{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:14px;cursor:pointer;background:#12228E;color:#fff;font:inherit;font-size:16px;font-weight:700}
  .botao:focus-visible{outline:2px solid #c2f24a;outline-offset:2px}
  :root{
    --bg:#eef0f4;--surface:#fff;--chip:#f3f5fd;--line:#dbe0f0;--line2:#eef1f6;
    --ink:#0f172a;--ink2:#334155;--muted:#475569;--accent:#12228E;--brand-line:#12228E;
    --alert:#be123c;--lime-ink:#4d6b0f;--foto-bg:#dbe0f0;--foto-fg:#6b7590;--dash:#c3cad8;
    color-scheme:light;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1024;--surface:#141a36;--chip:#1c2448;--line:#2a3360;--line2:#222a52;
      --ink:#e8ebf7;--ink2:#c7cde6;--muted:#9aa3c4;--accent:#a9b8ff;--brand-line:#3a4ba8;
      --alert:#fb7185;--lime-ink:#b5e04a;--foto-bg:#2a3360;--foto-fg:#9aa3c4;--dash:#3a4478;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1024;--surface:#141a36;--chip:#1c2448;--line:#2a3360;--line2:#222a52;
    --ink:#e8ebf7;--ink2:#c7cde6;--muted:#9aa3c4;--accent:#a9b8ff;--brand-line:#3a4ba8;
    --alert:#fb7185;--lime-ink:#b5e04a;--foto-bg:#2a3360;--foto-fg:#9aa3c4;--dash:#3a4478;
    color-scheme:dark;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);height:100%}
  body{height:100%}
  #app{min-height:100%;display:flex;flex-direction:column}
  #app>div{flex:1}
  @media (prefers-reduced-motion:no-preference){.entrar{animation:sobe .45s ease-out both}}
  @keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  body{margin:0;background:var(--bg);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
  a{color:var(--accent)}
  *,*::before,*::after{box-sizing:border-box}
  [data-act]{user-select:none;-webkit-tap-highlight-color:transparent}
  [data-act]:focus-visible{outline:2px solid #c2f24a;outline-offset:2px}
  .foto{display:grid;place-items:center;background:var(--foto-bg);color:var(--foto-fg);font-size:10.5px;font-weight:600}
</style>

/* ---------- API ---------- */
const CFG = window.PAINEL_CONFIG && window.PAINEL_CONFIG.url && window.PAINEL_CONFIG.chave ? window.PAINEL_CONFIG : null;
const sessao = { token: null, email: '', mensagem: '' };
class SessaoVencida extends Error {}

async function entrarNaApi(email, senha) {
  let resposta;
  try {
    resposta = await fetch(`${CFG.url.replace(/\/$/, '')}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: CFG.chave, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha }),
    });
  } catch { throw new Error('Não consegui conectar ao servidor. Confira a internet.'); }
  if (resposta.status === 400 || resposta.status === 401) throw new Error('E-mail ou senha incorretos.');
  if (!resposta.ok) throw new Error(`O login falhou (erro ${resposta.status}).`);
  return (await resposta.json()).access_token;
}

// A unidade vem do próprio login: é ela que a API usa para filtrar os dados.
function perfilDoToken(token) {
  try {
    const carga = JSON.parse(decodeURIComponent(escape(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
    const unidade = carga.app_metadata && carga.app_metadata.unidade;
    return { TODAS: 'admin', PKZ: 'prof', ONE_TO_ONE: 'prof-oto' }[unidade] || null;
  } catch { return null; }
}

async function lerTudo(view, parametros) {
  const linhas = [];
  let repetiu = false;
  for (;;) {
    const busca = new URLSearchParams({ ...parametros, limit: 1000, offset: linhas.length });
    let resposta;
    try {
      resposta = await fetch(`${CFG.url.replace(/\/$/, '')}/rest/v1/${view}?${busca}`, {
        headers: { apikey: CFG.chave, Authorization: `Bearer ${sessao.token}`, 'Accept-Profile': 'api' },
      });
    } catch { throw new Error('Não consegui conectar ao servidor. Confira a internet.'); }
    // Um 401 com o token ainda novo pode ser falha passageira: tenta de novo antes de pedir login.
    if (resposta.status === 401 && !repetiu) { repetiu = true; await new Promise(r => setTimeout(r, 800)); continue; }
    if (resposta.status === 401) throw new SessaoVencida('Sua sessão venceu. Entre de novo.');
    repetiu = false;
    if (!resposta.ok) throw new Error(`A API recusou a leitura de ${view} (erro ${resposta.status}).`);
    const pagina = await resposta.json();
    linhas.push(...pagina);
    if (pagina.length < 1000) return linhas;
  }
}

const hojeSP = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const faixaDe = idade => idade == null ? 'Todas as idades' : (CATALOGO.faixas_de_idade.find(f => f.ate == null || idade <= f.ate)).nome;

function percentil(valor, grupo, maiorMelhor) {
  const abaixo = grupo.filter(v => maiorMelhor ? v < valor : v > valor).length;
  const iguais = grupo.filter(v => v === valor).length;
  return Math.round(99 * (abaixo + 0.5 * iguais) / grupo.length);
}

// Atributos de cada atleta da PKZ em cada modalidade, comparando dentro da faixa de idade.
function calcularAtributos(atletas, medidas) {
  const ultimos = new Map();
  [...medidas].sort((a, b) => a.data_avaliacao < b.data_avaliacao ? -1 : a.data_avaliacao > b.data_avaliacao ? 1 : 0)
    .forEach(m => ultimos.set(`${m.atleta_id}|${m.teste}|${m.lado ?? ''}`, Number(m.valor)));
  const porFaixa = {};
  atletas.forEach(a => { (porFaixa[faixaDe(a.idade)] ??= []).push(a.atleta_id); });
  const resultado = {};
  atletas.forEach(a => { resultado[a.atleta_id] = {}; });
  dados.MOD.PKZ.forEach(mod => {
    Object.values(porFaixa).forEach(ids => {
      const valoresPorAtributo = DEFS.PKZ[mod].map(d => {
        if (d.tipo === 'percentil') {
          const pares = ids.map(i => [i, ultimos.get(`${i}|${d.teste}|`)]).filter(([, v]) => v !== undefined);
          if (pares.length < CATALOGO.regras.minimo_no_grupo) return {};
          const grupo = pares.map(([, v]) => v);
          return Object.fromEntries(pares.map(([i, v]) => [i, percentil(v, grupo, d.maior_melhor)]));
        }
        if (d.tipo === 'simetria') {
          return Object.fromEntries(ids.flatMap(i => {
            const dir = ultimos.get(`${i}|${d.teste}|dir`), esq = ultimos.get(`${i}|${d.teste}|esq`);
            return dir && esq ? [[i, Math.round(100 * Math.min(dir, esq) / Math.max(dir, esq))]] : [];
          }));
        }
        return {};
      });
      ids.forEach(i => { resultado[i][mod] = valoresPorAtributo.map(v => v[i] ?? null); });
    });
  });
  return resultado;
}

async function carregarDados() {
  const [atletas, medidas, presencas] = await Promise.all([
    lerTudo('atleta', { select: 'atleta_id,unidade,nome,idade,categoria,ativo', order: 'nome.asc,atleta_id.asc' }),
    lerTudo('evolucao', { select: 'atleta_id,teste,lado,data_avaliacao,valor', order: 'data_avaliacao.asc,atleta_id.asc,teste.asc,lado.asc' }),
    lerTudo('presenca', { select: 'agendamento_id,atleta_id,data,hora_inicio,status', order: 'data.asc,agendamento_id.asc' }),
  ]);
  const ativos = atletas.filter(a => a.ativo);
  const atributos = calcularAtributos(ativos.filter(a => a.unidade === 'PKZ'), medidas);
  const hoje = hojeSP();
  dados.alunos = ativos.map(a => {
    const dele = presencas.filter(p => p.atleta_id === a.atleta_id);
    const presentes = dele.filter(p => p.status === 'presente').length, faltas = dele.filter(p => p.status === 'falta').length;
    const deHoje = dele.find(p => p.data === hoje && p.status !== 'cancelado');
    return {
      id: a.atleta_id, nome: a.nome || 'Sem nome', age: a.idade, area: a.unidade === 'PKZ' ? 'PKZ' : 'OTO',
      categoria: a.categoria ? a.categoria.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()) : 'Sem categoria',
      porMod: atributos[a.atleta_id] || {}, attrsOto: DEFS.OTO.map(() => null),
      chamadas: presentes + faltas, presentes,
      hoje: deHoje ? `Hoje · ${(deHoje.hora_inicio || '').slice(0, 5)}` : null, statusHoje: deHoje ? deHoje.status : null,
    };
  });
}

/* ---------- estado ---------- */
// área fixa de cada perfil; o admin (null) escolhe a área nas abas
const AREA_DO_PERFIL = { admin: null, prof: 'PKZ', 'prof-oto': 'OTO' };
const NOME_DO_PERFIL = { admin: 'Admin', prof: 'Professor PKZ', 'prof-oto': 'Professor One to One' };
const estado = { tela:'inicio', role:null, area:'PKZ', cat:'todas', mod:dados.MOD.PKZ[0], attr:'card', sel:[], filtersOpen:false, vista:'cards' };
const ehMobile = () => window.innerWidth < 1100;

/* ---------- cálculo da tela ---------- */
function calcular() {
  const st = estado, { MOD } = dados;
  const area = AREA_DO_PERFIL[st.role] || st.area;
  const mod = area === 'PKZ' ? (MOD.PKZ.includes(st.mod) ? st.mod : MOD.PKZ[0]) : 'todas';
  const defs = dados.defsDe(area, mod);
  const attrs = defs.map(d => d.nome), abbr = defs.map(d => d.sigla);
  const fmt = n => n == null ? '—' : String(Math.round(n));
  const tab = on => ({ bg: on ? '#12228E' : 'transparent', fg: on ? '#fff' : 'var(--accent)', fw: on ? 600 : 500, on });
  const chip = on => ({ bg: on ? '#12228E' : 'var(--chip)', fg: on ? '#fff' : 'var(--accent)', fw: on ? 600 : 500, bd: on ? '#12228E' : 'var(--line)', on });
  const heroTab = on => ({ bg: on ? '#c2f24a' : 'rgba(255,255,255,.1)', fg: on ? '#0e1a6b' : '#e7eaf7', fw: on ? 700 : 500, on });

  const subOf = a => a == null ? 'Sem idade' : a <= 10 ? 'Sub 10' : a <= 12 ? 'Sub 12' : a <= 15 ? 'Sub 14/15' : 'Sub 17';
  const cat = area === 'PKZ' ? st.cat : 'todas';
  const list = dados.alunos
    .filter(x => x.area === area && (cat === 'todas' || subOf(x.age) === cat))
    .map(x => ({ ...x, attrs: area === 'PKZ' ? (x.porMod[mod] || defs.map(() => null)) : x.attrsOto }));
  const naLista = new Set(list.map(x => x.id));

  // a simetria fica fora da nota, como alerta
  const capsOf = x => x.attrs.filter((v, k) => defs[k].tipo !== 'simetria' && v != null);
  const cardVal = x => { const c = capsOf(x); return c.length >= CATALOGO.regras.minimo_de_atributos_para_nota ? c.reduce((a, b) => a + b, 0) / c.length : null; };
  const regraDe = v => CATALOGO.regras.niveis.find(r => v <= r.ate) || CATALOGO.regras.niveis.at(-1);
  const METAL = {
    bronze:{ bg:'linear-gradient(145deg,#d8a97c,#a06a3a)', fg:'#3a1f0b', sh:'inset 0 1px 0 rgba(255,255,255,.55)' },
    prata:{ bg:'linear-gradient(145deg,#c8ced6,#8d97a3)', fg:'#2b3138', sh:'inset 0 1px 0 rgba(255,255,255,.7)' },
    ouro:{ bg:'linear-gradient(145deg,#e8c96a,#bd9426)', fg:'#3d2f05', sh:'inset 0 1px 0 rgba(255,255,255,.6)' },
    preto:{ bg:'linear-gradient(145deg,#2c2f38,#0b0c10)', fg:'#e8c96a', sh:'inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(232,201,106,.55)' },
  };
  const valOf = (x, k) => k === 'card' ? cardVal(x) : x.attrs[k];
  const mean = k => { const v = list.map(x => valOf(x, k)).filter(n => n != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const means = attrs.map((_, k) => mean(k));
  const cardMean = mean('card');
  const status = (v, m) => v == null || m == null ? 'sem' : v - m > CATALOGO.regras.faixa_da_media ? 'acima' : m - v > CATALOGO.regras.faixa_da_media ? 'abaixo' : 'media';
  const ST = { acima:{ bg:'#dcf3e2', fg:'#0d5132', tag:'▲ acima', txt:'acima da média' }, media:{ bg:'#f1f4f9', fg:'#475569', tag:'● média', txt:'na média' }, abaixo:{ bg:'#fdeccb', fg:'#7a4708', tag:'▼ abaixo', txt:'abaixo da média' }, sem:{ bg:'#f1f4f9', fg:'#94a3b8', tag:'— sem dado', txt:'sem dado' } };
  const selK = st.attr === 'card' ? 'card' : Number(st.attr);
  const selMean = selK === 'card' ? cardMean : means[selK];
  const selName = selK === 'card' ? 'nota provisória' : attrs[selK].toLowerCase();

  const counts = { acima:0, media:0, abaixo:0, sem:0 };
  list.forEach(x => counts[status(valOf(x, selK), selMean)]++);
  const sorted = [...list].sort((a, b) => {
    const va = valOf(a, selK), vb = valOf(b, selK);
    if (va == null && vb == null) return a.nome.localeCompare(b.nome, 'pt-BR');
    if (va == null) return 1;
    if (vb == null) return -1;
    return vb - va;
  });
  // posição no ranking: quem empata no valor arredondado divide a posição
  let anterior = null, posAnterior = 0;
  const posicoes = sorted.map((x, i) => { const bruto = valOf(x, selK); if (bruto == null) return null; const v = Math.round(bruto); const p = v === anterior ? posAnterior : i + 1; anterior = v; posAnterior = p; return p; });
  const MEDALHA = { 1: METAL.ouro, 2: METAL.prata, 3: METAL.bronze };

  // Todo atleta da modalidade mostra os mesmos atributos: o que falta vira aviso, nunca número inventado.
  const listaDeNomes = n => n.length === 1 ? n[0] : `${n.slice(0, -1).join(', ')} e ${n.at(-1)}`;
  const avisoDe = x => {
    const faltam = attrs.filter((_, k) => x.attrs[k] == null);
    if (!faltam.length) return '';
    if (faltam.length === attrs.length) return 'Sem avaliação física ainda: os atributos e a nota aparecem depois da primeira.';
    const nota = cardVal(x) == null ? ` A nota aparece com pelo menos ${CATALOGO.regras.minimo_de_atributos_para_nota} atributos.` : '';
    return `Sem dados em ${listaDeNomes(faltam)}.${nota}`;
  };

  const cards = sorted.map((x, i) => {
    const s0 = ST[status(valOf(x, selK), selMean)];
    const isSel = st.sel.includes(x.id);
    const nota = cardVal(x);
    const cv = nota == null ? null : Math.round(nota);
    const regra = cv == null ? null : regraDe(cv), mt = regra ? regra.metal.toLowerCase() : null;
    const rank = posicoes[i], medalha = MEDALHA[rank];
    const valSel = valOf(x, selK);
    return {
      id: x.id, nome: x.nome, num: fmt(cv), pos: 'Nota provisória', lvl: regra ? regra.nivel : '—', metal: mt || 'sem nível', isSel,
      rank, rankTxt: rank ? `${rank}º` : '—', rankBg: medalha ? medalha.bg : 'var(--chip)', rankFg: medalha ? medalha.fg : 'var(--accent)', rankSh: medalha ? medalha.sh : 'none',
      valSel: fmt(valSel), barW: valSel == null ? 0 : Math.max(2, valSel / 99 * 100), stTag: s0.tag,
      consultas: [],
      lvlBg: mt ? METAL[mt].bg : 'rgba(255,255,255,.14)', lvlFg: mt ? METAL[mt].fg : '#fff', lvlSh: mt ? METAL[mt].sh : 'none',
      meta: x.area === 'PKZ' ? `${x.categoria}${x.age != null ? ` · ${x.age} anos` : ''} · ${mod}` : `One to One${x.age != null ? ` · ${x.age} anos` : ''}`,
      cardAttrs: x.attrs.map((v, k) => ({ abbr: abbr[k], nome: attrs[k], sem: v == null, val: fmt(v), color: (defs[k].tipo === 'simetria' && v != null && v < CATALOGO.regras.simetria_minima) ? 'var(--alert)' : 'var(--accent)' })),
      avisoFalta: avisoDe(x),
      stBg: s0.bg, stFg: s0.fg, stTxt: `${fmt(valOf(x, selK))} · ${s0.txt}`,
      border: isSel ? 'var(--accent)' : 'var(--line)',
      attrs: attrs.map((n, k) => { const s1 = ST[status(x.attrs[k], means[k])]; return { abbr: abbr[k], nome: n, txt: s1.txt, bg: s1.bg, fg: s1.fg, tag: s1.tag.split(' ')[0], ring: selK === k ? '2px solid var(--accent)' : 'none' }; }),
      hojeLabel: x.hoje ? `${x.hoje} · ${x.statusHoje === 'presente' ? 'presença registrada' : x.statusHoje === 'falta' ? 'falta registrada' : 'aguardando chamada'}` : 'Sem sessão hoje',
      freq: x.chamadas ? `${Math.round(100 * x.presentes / x.chamadas)}% de presença em ${x.chamadas} ${x.chamadas === 1 ? 'chamada' : 'chamadas'}` : 'Sem chamada registrada',
      cmpBg: isSel ? '#12228E' : 'var(--surface)', cmpFg: isSel ? '#fff' : 'var(--accent)', cmpLabel: isSel ? '✓ Na comparação' : 'Comparar',
    };
  });

  // só entram na comparação alunos que continuam visíveis no recorte atual
  const selAl = st.sel.filter(id => naLista.has(id)).map(id => list.find(x => x.id === id));
  const hasCompare = selAl.length === 2;
  let cmpRows = [], cmpText = '', cmpA = '', cmpB = '';
  if (hasCompare) {
    const [A, B] = selAl;
    cmpA = A.nome; cmpB = B.nome;
    cmpRows = attrs.map((n, k) => {
      const a = A.attrs[k], b = B.attrs[k], temOsDois = a != null && b != null, d = temOsDois ? a - b : 0;
      return { label:n, aV:fmt(a), bV:fmt(b), aW:(a ?? 0)/99*100, bW:(b ?? 0)/99*100, meanL:(means[k] ?? 0)/99*100, diffTxt: !temOsDois ? 'sem dado' : d === 0 ? 'iguais' : `${d > 0 ? A.nome.split(' ')[0] : B.nome.split(' ')[0]} +${Math.abs(d)}`, diffColor: !temOsDois || d === 0 ? 'var(--muted)' : d > 0 ? 'var(--accent)' : 'var(--lime-ink)' };
    });
    const winA = attrs.filter((_, k) => A.attrs[k] != null && B.attrs[k] != null && A.attrs[k] > B.attrs[k]).length, winB = attrs.filter((_, k) => A.attrs[k] != null && B.attrs[k] != null && B.attrs[k] > A.attrs[k]).length;
    cmpText = `${A.nome.split(' ')[0]} está à frente em ${winA} de ${attrs.length} atributos e ${B.nome.split(' ')[0]} em ${winB}. Na nota provisória: ${fmt(cardVal(A))} contra ${fmt(cardVal(B))}, com o grupo em ${fmt(cardMean)}.`;
  }

  const areaTxt = area === 'PKZ' ? 'PKZ' : 'One to One';
  const ageTxt = cat === 'todas' ? '' : ` · ${cat}`;
  const modTxt = mod === 'todas' ? '' : ` · ${mod}`;
  const n = list.length;
  const semNotas = n > 0 && counts.sem === n;
  const heroText = !n ? 'Nenhum aluno no recorte.'
    : semNotas ? (area === 'OTO' ? `Os ${n} alunos do One to One ainda não têm avaliações físicas na API, por isso não há nota nem atributos.` : `Ainda não há dados de ${selName} para este recorte.`)
    : `${counts.acima} ${counts.acima === 1 ? 'aluno está' : 'alunos estão'} acima da média em ${selName}, ${counts.media} na média e ${counts.abaixo} abaixo.${counts.sem ? ` ${counts.sem} sem dado.` : ''}`;

  // resumo do dia: a chamada registrada hoje no sistema, só para leitura
  const comHoje = list.filter(x => x.hoje);
  const presentes = comHoje.filter(x => x.statusHoje === 'presente').length;
  const faltas = comHoje.filter(x => x.statusHoje === 'falta').length;
  const resumo = {
    itens: [
      { valor: comHoje.length, rotulo: 'sessões hoje', cor: 'var(--accent)' },
      { valor: presentes, rotulo: 'presentes', cor: 'var(--lime-ink)' },
      { valor: faltas, rotulo: faltas === 1 ? 'falta' : 'faltas', cor: 'var(--alert)' },
      { valor: comHoje.length - presentes - faltas, rotulo: 'aguardando chamada', cor: 'var(--muted)' },
    ],
  };

  // distribuição da turma por nível: a leitura do grupo inteiro antes de olhar aluno por aluno
  const comNota = list.filter(x => cardVal(x) != null);
  const distribuicao = [...CATALOGO.regras.niveis].reverse().map(r => {
    const qtd = comNota.filter(x => regraDe(Math.round(cardVal(x))).nivel === r.nivel).length;
    const m = METAL[r.metal.toLowerCase()];
    return { nivel: r.nivel, metal: r.metal, qtd, pct: comNota.length ? Math.round(100 * qtd / comNota.length) : 0, bg: m.bg, fg: m.fg };
  });

  const isMobile = ehMobile();
  const layout = !isMobile
    ? { mainMax:'1880px', mainDir:'row', mainAlign:'flex-start', mainGap:'20px', asideW:'clamp(280px,18vw,340px)', asidePos:'sticky' }
    : { mainMax:'1240px', mainDir:'column', mainAlign:'stretch', mainGap:'16px', asideW:'100%', asidePos:'static' };
  const nAct = cat !== 'todas' ? 1 : 0;
  const nSel = selAl.length;
  const temDados = k => list.some(x => x.attrs[k] != null);

  return {
    ...layout, isMobile, showFilters: !isMobile || st.filtersOpen, filtersOpen: st.filtersOpen,
    filterBadge: `${area === 'PKZ' ? 'PKZ · ' + mod : 'One to One'}${nAct ? ` · ${nAct} filtro` : ''} · ${st.filtersOpen ? 'fechar' : 'abrir'}`,
    perfil: NOME_DO_PERFIL[st.role],
    areaTabs: [['PKZ','PKZ'],['OTO','One to One']].map(([k, l]) => { const lock = !!AREA_DO_PERFIL[st.role] && k !== area; return { label:l, ...tab(area === k), op: lock ? 0.4 : 1, act: lock ? '' : 'area', v:k }; }),
    modTabs: area === 'PKZ' ? MOD.PKZ.map(m => ({ label:m, ...chip(mod === m), act:'mod', v:m })) : [],
    modNote: area === 'PKZ'
      ? 'A API ainda não informa a modalidade de cada atleta. A escolha aqui troca os atributos usados; a lista traz todos os atletas ativos da PKZ.'
      : 'O One to One não separa os alunos por modalidade na API.',
    attrTabs: [['card','Nota provisória'], ...attrs.map((a, k) => [String(k), a])].map(([k, l]) => { const livre = k === 'card' || temDados(Number(k)); return { label:l, ...heroTab(String(st.attr) === k), act: livre ? 'attr' : '', op: livre ? 1 : 0.45, v:k }; }),
    catTabs: [['todas', area === 'PKZ' ? 'Todas' : 'Sem categoria no One to One'], ...(area === 'PKZ' ? ['Sub 10','Sub 12','Sub 14/15','Sub 17'].map(c => [c, c]) : [])].map(([k, l]) => ({ label:l, ...chip(cat === k), op: area === 'PKZ' ? 1 : 0.5, act: area === 'PKZ' ? 'cat' : '', v:k })),
    filterSummary: `${areaTxt}${ageTxt}${modTxt} · ${n} ${n === 1 ? 'aluno' : 'alunos'}${AREA_DO_PERFIL[st.role] ? ' · o login vê só a própria área' : ''}`,
    heroText,
    statCards: [
      { value: fmt(selMean), label:'Média do grupo', sub:selName, color:'#fff' },
      { value: String(counts.acima), label:'Acima da média', sub:'mais de 5 pontos acima', color:'#c2f24a' },
      { value: String(counts.media), label:'Na média', sub:'até 5 pontos de diferença', color:'#fff' },
      { value: String(counts.abaixo), label:'Abaixo da média', sub:'mais de 5 pontos abaixo', color:'#f5c77e' },
    ],
    hasCompare, cmpRows, cmpText, cmpA, cmpB,
    listTitle: st.vista === 'ranking'
      ? `Ranking de ${selName} · ${area === 'PKZ' ? mod : 'One to One'}`
      : `${area === 'PKZ' ? mod : 'Alunos'} · ordenados por ${selName}`,
    vista: st.vista, resumo, meanBar: (selMean ?? 0) / 99 * 100, distribuicao, comNota: comNota.length,
    vistaTabs: [['cards','Cards'],['ranking','Ranking']].map(([k, l]) => ({ label:l, ...tab(st.vista === k), act:'vista', v:k })),
    compareHint: st.vista === 'ranking'
      ? 'Quem empata no valor divide a posição'
      : nSel === 1 ? 'Escolha mais um aluno para comparar' : 'Toque em Comparar em dois alunos',
    isEmpty: n === 0, cards,
  };
}

/* ---------- desenho da tela ---------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
// todo controle clicável vira botão acessível: foco pelo teclado e estado anunciado
const acao = (act, v, id, pressed) => act
  ? ` data-act="${act}" role="button" tabindex="0"${pressed !== undefined ? ` aria-pressed="${!!pressed}"` : ''}${v !== undefined ? ` data-v="${esc(v)}"` : ''}${id ? ` data-id="${esc(id)}"` : ''}`
  : ' aria-disabled="true"';

function aba(t, pad) {
  return `<span${acao(t.act, t.v, undefined, t.on)} style="display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 ${pad}px;border-radius:8px;cursor:${t.act ? 'pointer' : 'not-allowed'};font-size:12.5px;font-weight:${t.fw};background:${t.bg};color:${t.fg};opacity:${t.op ?? 1}">${esc(t.label)}</span>`;
}
function pilula(t) {
  return `<span${acao(t.act, t.v, undefined, t.on)} style="display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:9px;cursor:${t.act ? 'pointer' : 'default'};font-size:12px;font-weight:${t.fw};background:${t.bg};color:${t.fg};border:1px solid ${t.bd};opacity:${t.op ?? 1}">${esc(t.label)}</span>`;
}
const grupoAbas = itens => `<div style="display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:11px;background:var(--chip);border:1px solid var(--line)">${itens}</div>`;
const rotulo = t => `<span style="font-size:11.5px;font-weight:600;color:var(--ink)">${t}</span>`;

/* ---------- entrada: login real; o perfil vem da unidade do usuário ---------- */
function desenharInicio() {
  const carregando = estado.tela === 'carregando';

async function entrar(email, senha) {
  sessao.email = email; sessao.mensagem = '';
  estado.tela = 'carregando'; desenhar();
  try {
    sessao.token = await entrarNaApi(email, senha);
    const perfil = perfilDoToken(sessao.token);
    if (!perfil) throw new Error('Este usuário ainda não tem unidade definida. Fale com o Desenvolvimento.');
    estado.role = perfil;
    if (AREA_DO_PERFIL[perfil]) estado.area = AREA_DO_PERFIL[perfil];
    await carregarDados();
    estado.tela = 'painel';
    desenhar();
    window.scrollTo(0, 0);
  } catch (erro) {
    sair(erro.message);
  }
}

function sair(mensagem = '') {
  sessao.token = null; sessao.mensagem = mensagem; dados.alunos = [];
  Object.assign(estado, { tela:'inicio', role:null, sel:[], attr:'card', cat:'todas', area:'PKZ', mod:dados.MOD.PKZ[0] });
  desenhar();
}

async function atualizar() {
  try { await carregarDados(); redesenhar(); }
  catch (erro) { if (erro instanceof SessaoVencida) sair(erro.message); else { sessao.mensagem = erro.message; redesenhar(); } }
}

              <p style="margin:3px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums">${esc(a.meta)}</p>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px">
              ${a.cardAttrs.map(t => `<span title="${esc(t.nome)}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:6px 2px;border-radius:10px;text-align:center;${t.sem ? 'background:#fdf6e6;border:1px dashed #e6c98a' : 'background:#f7f8fd;border:1px solid transparent'}"><span style="font-size:11px;font-weight:700;color:var(--muted)">${esc(t.abbr)}</span>${t.sem ? '<span style="display:grid;place-items:center;height:30px;font-size:11.5px;font-weight:600;color:#7a4708">sem dado</span>' : `<span style="font-size:24px;font-weight:800;line-height:30px;color:${t.color};font-variant-numeric:tabular-nums">${t.val}</span>`}<span style="font-size:10.5px;line-height:1.15;color:var(--muted)">${esc(t.nome)}</span></span>`).join('')}
            </div>
            ${a.avisoFalta ? `<p style="margin:0 12px 12px;padding:8px 10px;border-radius:9px;background:#fdf3dc;color:#7a4708;font-size:12px;line-height:1.4;font-weight:500">${esc(a.avisoFalta)}</p>` : ''}
          </div>
          <div style="background:var(--surface);border:1px solid ${a.border};border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:10px">

            <div style="display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line2)">
              <div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px">

        </article>`).join('')}

      <p style="margin:0;font-size:11.5px;line-height:1.55;color:var(--muted);text-wrap:pretty">Dados reais, lidos da API. O painel só lê: a chamada continua sendo feita no sistema. Atleta sem dado num atributo recebe um aviso no cartão, e as regras estão em CATALOGO_ATRIBUTOS.md.</p>

    </div>
  </footer>
</div>`;
}

/* ---------- redesenho sem perder o foco do teclado ---------- */
function redesenhar() {
  const f = document.activeElement;
  const chave = f && f.dataset && f.dataset.act ? [f.dataset.act, f.dataset.v ?? '', f.dataset.id ?? ''] : null;
  desenhar();
  if (!chave) return;
  const alvo = [...document.querySelectorAll('[data-act]')].find(el => el.dataset.act === chave[0] && (el.dataset.v ?? '') === chave[1] && (el.dataset.id ?? '') === chave[2]);
  if (alvo) alvo.focus({ preventScroll: true });
}

/* ---------- interação ---------- */
function agir(alvo) {
  const act = alvo.dataset.act, v = alvo.dataset.v, id = alvo.dataset.id;
  const st = estado;
  if (act === 'sair') { sair(); return; }
  if (act === 'atualizar') { atualizar(); return; }
  if (act === 'area') { st.area = v; st.mod = dados.MOD.PKZ[0]; st.attr = 'card'; st.sel = []; }
  else if (act === 'cat') { st.cat = v; st.sel = []; }
  else if (act === 'mod') { st.mod = v; st.attr = 'card'; st.sel = []; }
  else if (act === 'attr') st.attr = v;
  else if (act === 'vista') st.vista = v;
  else if (act === 'filtros') st.filtersOpen = !st.filtersOpen;
  else if (act === 'limpar') { st.cat = 'todas'; st.mod = dados.MOD.PKZ[0]; }
  else if (act === 'fechar-cmp') st.sel = [];
  else if (act === 'comparar') st.sel = st.sel.includes(id) ? st.sel.filter(x => x !== id) : [...st.sel, id].slice(-2);
  else return;
  redesenhar();
}

document.addEventListener('submit', evento => {
  if (evento.target.id !== 'form-login') return;
  evento.preventDefault();
  const dadosDoForm = new FormData(evento.target);
  entrar(String(dadosDoForm.get('email')).trim(), String(dadosDoForm.get('senha')));
});
document.addEventListener('click', evento => {
  const alvo = evento.target.closest('[data-act]');
  if (alvo) agir(alvo);
});
document.addEventListener('keydown', evento => {
  if (evento.key !== 'Enter' && evento.key !== ' ') return;
  const alvo = evento.target.closest && evento.target.closest('[data-act]');
  if (!alvo) return;
  evento.preventDefault();
  agir(alvo);
});

let largura = window.innerWidth;
window.addEventListener('resize', () => {
  if ((largura < 1100) !== (window.innerWidth < 1100)) { largura = window.innerWidth; redesenhar(); }
  largura = window.innerWidth;
});

desenhar();
</script>
